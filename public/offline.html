<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GymArc — offline</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#09090b; color:#f4f4f5; font-family:system-ui,sans-serif; text-align:center; padding:24px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:#71717a; font-size:14px; margin:0 0 20px; }
    button { background:#e11d48; color:#fff; border:0; border-radius:14px; padding:12px 24px; font-weight:700; font-size:14px; }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>GymArc needs a connection to load your data.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
